<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>My Christmas List 🎄</title>
<style>
:root{--red:#a91f3b;--green:#17634a;--cream:#fff8ec;--gold:#e7b84b;--ink:#352b2b;--pink:#ffdce5}
*{box-sizing:border-box}body{margin:0;font-family:Georgia,serif;color:var(--ink);background:radial-gradient(circle at 10% 10%,#fff 0 5%,transparent 6%),linear-gradient(135deg,#fff9ef,#f7e9df);min-height:100vh}
button,a{font:inherit}.snow{position:fixed;inset:0;pointer-events:none;opacity:.28;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:28px 28px}
header{text-align:center;padding:48px 20px 25px}h1{font-size:clamp(2.4rem,6vw,4.7rem);margin:0;color:var(--red);text-shadow:2px 2px 0 #f2cbd2}.subtitle{font-size:1.15rem;max-width:700px;margin:12px auto;line-height:1.6}
main{max-width:1120px;margin:auto;padding:10px 20px 60px}.crumbs{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;margin:15px 0 25px}.crumb{background:#fff;border:1px solid #ead9ce;border-radius:999px;padding:8px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px}.card{background:rgba(255,255,255,.9);border:2px solid #ead9ce;border-radius:24px;padding:24px;box-shadow:0 10px 28px #7a4b4215;transition:.2s}.card:hover{transform:translateY(-4px);box-shadow:0 15px 32px #7a4b4224}.choice{cursor:pointer;text-align:center}.choice .emoji{font-size:3rem;display:block;margin-bottom:8px}.choice h2{margin:8px 0;color:var(--green)}.choice p{margin:0;line-height:1.4}
.primary{background:var(--red);color:#fff;border:0;border-radius:999px;padding:12px 18px;cursor:pointer}.secondary{background:#fff;color:var(--green);border:2px solid var(--green);border-radius:999px;padding:10px 16px;cursor:pointer}
.actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 25px}.hint{text-align:center;background:#fff6d9;border:1px dashed var(--gold);padding:12px 16px;border-radius:16px;margin:0 auto 20px;max-width:760px}
.item{display:flex;flex-direction:column;gap:12px}.item h3{margin:0;color:var(--green);font-size:1.15rem}.price{font-weight:bold;color:var(--red);font-size:1.1rem}.notes{font-size:.94rem;line-height:1.45;color:#5f5555}.buy{display:inline-block;text-decoration:none;text-align:center;background:var(--green);color:#fff;border-radius:12px;padding:10px 12px}.most{display:inline-block;background:#ffe5a8;color:#6b4a00;border-radius:999px;padding:5px 9px;font-size:.78rem;font-weight:bold}
.hidden{display:none}.empty{text-align:center;padding:40px;background:#fff;border-radius:24px}.santa{font-size:5rem;display:block;animation:dance .8s infinite alternate ease-in-out}@keyframes dance{to{transform:rotate(8deg) translateY(-5px)}}footer{text-align:center;padding:30px;color:#766a66;font-size:.9rem}
</style>
</head>
<body><div class="snow"></div>
<header><div class="santa">🎅</div><h1>My Christmas List 🎄</h1><p class="subtitle">Welcome, gift-giver! Pick how you know me, choose your budget, and find something you can buy, make, or experience with me. 💕</p></header>
<main>
<div id="crumbs" class="crumbs"></div><div id="app"></div>
</main><footer>Made with Christmas spirit ✨</footer>
<script>
const DATA = {"items": [{"name": "Georgia State Park Pass", "price": 55, "kind": "gift", "notes": "Annual/state park pass."}, {"name": "Hiking Backpack", "price": 36, "kind": "gift", "notes": "Green — this is the color I want.", "url": "https://www.amazon.com/Maelstrom-Backpack-Waterproof-Lightweight-Backpack-Green/dp/B0DRNDJSZ6"}, {"name": "19-Piece Kitchen Knife Block Set", "price": 40, "kind": "gift", "notes": "CreamWhite color. Price updated from your latest list.", "url": "https://www.amazon.com/HENKELIVING-19-Piece-Kitchen-Built-Sharpener/dp/B0GNGXLVK6"}, {"name": "50ft Dog Tie-Out Cable / Overhead Trolley", "price": 20, "kind": "gift", "notes": "Orange color.", "url": "https://www.amazon.com/XiaZ-Camping-Portable-Overhead-200lbs%EF%BC%8CDog/dp/B08PFQMWRJ"}, {"name": "Dog Backpack for Hiking", "price": 40, "kind": "gift", "notes": "Size Large — orange, brown, or pink.", "url": "https://www.amazon.com/OneTigris-Backpack-Mammoth-Tactical-Training/dp/B0BZVLSSPP"}, {"name": "Single-Sleeper Hammock", "price": 35, "kind": "gift", "notes": "Charcoal and Rose preferred, but any color is okay.", "url": "https://www.amazon.com/Wise-Owl-Outfitters-Hammock-Hammocks/dp/B01E3EHRVS"}, {"name": "Hands-Free Dog Leash with Zipper Pouch", "price": 25, "kind": "gift", "notes": "Large, 25–120 lb — Baby Pink.", "url": "https://www.amazon.com/iYoShop-Hands-Leash-Zipper-25-120/dp/B0C7D33L2P"}, {"name": "Emergency Dog Sling for Hiking", "price": 50, "kind": "gift", "notes": "Size Large.", "url": "https://www.amazon.com/OneTigris-Harness-Backpack-Carrier-Injuries/dp/B0GRV6S29T"}, {"name": "Pet First Aid Kit", "price": 40, "kind": "gift", "notes": "", "url": "https://www.amazon.com/EVERLIT-Vet-Approved-Emergency-Supplies-Travel-Friendly/dp/B0DDWFX242"}, {"name": "Dog Travel Water Bottle", "price": 17, "kind": "gift", "notes": "18 oz — Pink.", "url": "https://www.amazon.com/lesotc-Foldable-Dispenser-Lightweight-Convenient/dp/B07Q56TTD4"}, {"name": "Dog Car Seat", "price": 45, "kind": "gift", "notes": "Seat only; $45 or more.", "url": "https://www.amazon.com/MIXJOY-Seat-Cover-Cars-Truck/dp/B0D14GQ5CG"}, {"name": "ChomChom Pet Hair Remover", "price": 25, "kind": "gift", "notes": "Original size — White.", "url": "https://www.amazon.com/Pet-Dog-Cat-Hair-Remover-Couch/dp/B00BAGTNAQ"}, {"name": "SUV Air Mattress with Pump", "price": 65, "kind": "gift", "notes": "Green and charcoal.", "url": "https://www.amazon.com/Ciremiv-Mattress-Double-Sided-Thick-Complete-Accessories/dp/B0DQL19R3M"}, {"name": "Mouse Ears Travel Case", "price": 20, "kind": "gift", "notes": "Chenille Letter Bow Mouse Ears Travel Case, large round tote. Mom & Dad only.", "url": "https://www.amazon.com/Chenille-Headband-Shoulder-Hairband-Accessories/dp/B0DBZKCLZL", "only": ["Mom", "Dad"]}, {"name": "Interchangeable Mouse Welcome Door Sign", "price": 20, "kind": "gift", "notes": "Seasonal welcome door sign. Mom, Dad & Edgar only.", "url": "https://www.amazon.com/SUPYFD-Interchangeable-Seasonal-Farmhouse-Housewarming/dp/B0C6YJSQ2T", "only": ["Mom", "Dad", "Edgar"]}, {"name": "I'm Listening Bumper Sticker", "price": 4, "kind": "gift", "notes": "Frasier-themed.", "url": "https://www.etsy.com/listing/1639315152/im-listening-frasier-vinyl-sticker"}, {"name": "Frasier Tree Ornament", "price": 15, "kind": "gift", "notes": "", "url": "https://www.etsy.com/listing/4357438561/frasier-veneer-double-sided-ceramic"}, {"name": "Scratch-Off Book for Dog Adventures", "price": 30, "kind": "gift", "notes": "", "url": "https://www.chewy.com/gift-republic-my-dog-journal/dp/3701958"}, {"name": "Matching Dog + Human Hoodies", "price": 69, "kind": "gift", "notes": "XL person + XL dog; Snow Cone. Total for both.", "urls": ["https://www.sparkpaws.com/products/pink-blue-sky-dye-human-hoodie-matching", "https://www.sparkpaws.com/products/pink-blue-sky-dye-dog-hoodie"]}, {"name": "Paddle Board", "price": 165, "kind": "gift", "notes": "Mint Green with black stand-up pad. Mom, Dad, Sister & Edgar only. Price updated from your latest list.", "url": "https://www.amazon.com/Premium-Inflatable-Accessories-Non-Slip-Standing/dp/B08DHX1HYF", "only": ["Mom", "Dad", "Sister", "Edgar"]}, {"name": "Dog Life Jacket", "price": 20, "kind": "gift", "notes": "Pink.", "url": "https://www.amazon.com/VIVAGLORY-Removable-Padding-Reflective-Swimming/dp/B09MT1NLLD"}, {"name": "Onlypuff Maxi Skirt", "price": 30, "kind": "gift", "notes": "Size XL — Khaki, Army Green, Black, or peony. If a color is unavailable, choose among the others.", "url": "https://www.amazon.com/onlypuff-Western-Pockets-Festival-Clothing/dp/B0FT3W2NS2"}, {"name": "Winnie the Pooh & Friends Mystery Mini Backpack Keychain Charm", "price": 25, "kind": "gift", "notes": "", "url": "https://loungefly.com/winnie-the-pooh-friends-cosplay-mystery-mini-backpack-keychain-charm/WDK0783-EA.html"}, {"name": "Pixar Dogs & Cats Mystery Mini Backpack Keychain Charm", "price": 25, "kind": "gift", "notes": "", "url": "https://loungefly.com/pixar-dogs-cats-cosplay-mystery-mini-backpack-keychain-charm/WDBC0034.html"}, {"name": "Bath Robe", "price": 20, "kind": "gift", "notes": "Size XL — Dark Gray or Wine Red. Price updated from your latest list.", "url": "https://www.amazon.com/PrinStory-Womens-Bathrobe-Lightweight-Black-L/dp/B0DC99ZTY7"}, {"name": "Bathtub Tray", "price": 25, "kind": "gift", "notes": "Color A Natural.", "url": "https://www.amazon.com/Premium-Foldable-Expandable-Bathroom-Accessories/dp/B0FXGNXFV4"}, {"name": "Luxury Bathtub Pillow", "price": 25, "kind": "gift", "notes": "Head & neck support.", "url": "https://www.amazon.com/Ozyalo-Pillows-Luxury-Bathtub-Support/dp/B0BJ8LLHF5"}, {"name": "Park Doodles Coffee Sleeve", "price": 12, "kind": "gift", "notes": "Size Medium.", "url": "https://www.etsy.com/listing/4483583913/park-doodles-coffee-sleeves"}, {"name": "Disney Coffee Cups Sweatshirt", "price": 30, "kind": "gift", "notes": "Unisex XL — Forest Green. Price updated from your latest list.", "url": "https://www.etsy.com/listing/4494511702/disney-coffee-cups-sweatshirt-disney"}, {"name": "Magical Mickey Mouse Glass Can Cup", "price": 16, "kind": "gift", "notes": "16 oz, bamboo lid; frosted printing option. Price excludes shipping.", "url": "https://www.etsy.com/listing/4531638078/magical-mickey-mouse-glass-can-cup"}, {"name": "Mickey Tumbler", "price": 25, "kind": "gift", "notes": "Personalized Disney 20 oz skinny cup with straw; price excludes shipping.", "url": "https://www.etsy.com/listing/1766966873/disney-20oz-skinny-tumbler-magical"}], "giftCards": [["Apple Gift Card", "Most wanted gift card", "apple"], ["Amazon Gift Card", "Any amount", "amazon"], ["Burlington Gift Card", "Any amount", "burlington"], ["TJ Maxx Gift Card", "Any amount", "tjmaxx"], ["Publix Gift Card", "Any amount", "publix"], ["Kroger Gift Card", "Any amount", "kroger"], ["Sugarloaf Salon 124 Gift Card", "Where I get my hair done", "salon"]], "homemade": [["Homemade Card", "Most wanted from nieces & nephews", "💌"], ["Dog Ear Cover", "", "🐶"], ["Ear Cover for Me", "", "🎀"], ["Homemade Dog Treats", "", "🦴"], ["Homemade Cookies", "", "🍪"], ["Sourdough Bread", "", "🍞"], ["Reheat-able Rice Warmer Pads", "Large preferred for abdomen/back if possible; all sizes welcome.", "🔥"], ["Clay Fridge Magnets", "Especially ones made by kids!", "🧲"], ["Sugar Scrubs", "", "🫧"], ["Homemade Clay Ring Holders", "", "💍"], ["Homemade Iced Coffee Cover", "", "🧋"]], "experiences": ["Day at the Zoo", "Day at the Aquarium", "Go to a Sports Game Together", "Nail Salon Visit — on You", "Museum Day", "Coffee Tour Day", "Try a New Food — on You", "Cooking Classes Together"], "budgets": [["homemade", "🏠", "Homemade", "Make something with love"], ["5-10", "🎁", "$5–10", "Little gifts, big smiles"], ["10-25", "✨", "$10–25", "Cute & affordable"], ["25-50", "🎄", "$25–50", "A little splurge"], ["50+", "⭐", "$50+", "Big wishlist energy"], ["experiences", "🎟️", "Experiences", "Let's make a memory"]]};
const state={page:"people",person:null,budgets:[]};
const people=[
 ["Family","You Owe Me","👨‍👩‍👧‍👦","family"],["Friends","Love you guys <3","🥂","friends"],
 ["Nieces & Nephews","Time to spoil me like I spoil you","🧸","nieces"],["Secret Santa","Pick something merry!","🎅","secret"],
 ["Edgar","You Owe Me the Most","❤️","Edgar"]
];
const relations=[["Mom","💐"],["Dad","🧢"],["Sister","💖"],["Grandparent","👵"]];
const $=id=>document.getElementById(id);
function setPage(p){state.page=p;render()}
function crumb(){let c=['<span class="crumb">🎄 My Christmas List</span>'];if(state.person)c.push('<span class="crumb">'+esc(state.person)+'</span>');if(state.budgets.length)c.push('<span class="crumb">'+state.budgets.length+' budget'+(state.budgets.length>1?'s':'')+' selected</span>');$('crumbs').innerHTML=c.join('')}
function esc(s){return String(s).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function card(title,desc,emoji,onclick){return `<div class="card choice" onclick="${onclick}"><span class="emoji">${emoji}</span><h2>${esc(title)}</h2><p>${esc(desc)}</p></div>`}
function render(){
 crumb();let a=$('app');
 if(state.page==='people'){
  a.innerHTML='<div class="hint">🎁 First: tell me how you are related to me!</div><div class="grid">'+people.map(x=>card(x[0],x[1],x[2],`choosePerson('${x[3]}')`)).join('')+'</div>';return
 }
 if(state.page==='relations'){
  a.innerHTML='<div class="actions"><button class="secondary" onclick="setPage(\'people\')">← Back</button></div><div class="hint">Family gets one extra step: choose your relationship to me. 💕</div><div class="grid">'+relations.map(x=>card(x[0],'See the gifts picked for you',x[1],`chooseRelation('${x[0]}')`)).join('')+'</div>';return
 }
 if(state.page==='budgets'){
  a.innerHTML='<div class="actions"><button class="secondary" onclick="goBackPerson()">← Back</button><button class="primary" onclick="showGifts()">Show My Picks →</button></div><div class="hint">✨ Pick <b>one or more</b> budgets. You can mix and match!</div><div class="grid">'+DATA.budgets.map(x=>card(x[2],x[3],x[1],`toggleBudget('${x[0]}')`)+(state.budgets.includes(x[0])?'<div style="text-align:center;margin-top:-10px"><span class="most">✓ Selected</span></div>':'')).join('')+'</div>';return
 }
 if(state.page==='gifts'){renderGifts();return}
}
function choosePerson(p){state.person=p;state.budgets=[];state.page=(p==='family'?'relations':'budgets');render()}
function chooseRelation(p){state.person=p;state.budgets=[];state.page='budgets';render()}
function goBackPerson(){state.page=(['Mom','Dad','Sister','Grandparent'].includes(state.person)?'relations':'people');render()}
function toggleBudget(b){state.budgets=state.budgets.includes(b)?state.budgets.filter(x=>x!==b):[...state.budgets,b];render()}
function showGifts(){if(!state.budgets.length){alert('Pick at least one budget first! 🎁');return}state.page='gifts';render()}
function allowed(item){
 if(item.only && !item.only.includes(state.person))return false;
 if(state.person==='nieces' && item.price!=null && item.price>25)return false;
 if(state.person==='secret' && item.price!=null && item.price>45)return false;
 return true;
}
function budgetFor(price){if(price==null)return null;if(price<=10)return'5-10';if(price<=25)return'10-25';if(price<=50)return'25-50';return'50+'}
function itemCard(it){let links=it.urls|| (it.url?[it.url]:[]);return `<div class="card item"><div><h3>${esc(it.name)}</h3>${it.notes?`<div class="notes">${esc(it.notes)}</div>`:''}</div><div class="price">${it.price==null?'Price not provided':'$'+it.price}</div>${links.map((u,i)=>`<a class="buy" target="_blank" rel="noopener" href="${u}">${links.length>1?'Open link '+(i+1):'View / Buy Gift ↗'}</a>`).join('')}</div>`}
function specialCards(){
 let s='';
 if(state.budgets.includes('homemade'))s+=`<h2 style="color:var(--green)">🏠 Homemade — made with love</h2><div class="grid">${DATA.homemade.map(x=>`<div class="card item"><h3>${esc(x[0])}</h3>${x[0]==='Homemade Card'?'<span class="most">MOST WANTED FROM NIECES & NEPHEWS</span>':''}<div class="notes">${esc(x[1])}</div><div style="font-size:2rem">${x[2]}</div></div>`).join('')}</div>`;
 if(state.budgets.includes('experiences'))s+=`<h2 style="color:var(--green);margin-top:35px">🎟️ Experiences — make a memory with me</h2><div class="grid">${DATA.experiences.map(x=>`<div class="card choice"><span class="emoji">✨</span><h2>${esc(x)}</h2><p>You're the gift. Let's do something fun together!</p></div>`).join('')}</div>`;
 s+=`<h2 style="color:var(--green);margin-top:35px">🎁 Gift Cards — any amount</h2><div class="grid">${DATA.giftCards.map(x=>`<div class="card item">${x[2]==='apple'?'<span class="most">⭐ MOST WANTED GIFT CARD</span>':''}<h3>${esc(x[0])}</h3><div class="notes">${esc(x[1])}</div><div style="font-size:2rem">🎟️</div></div>`).join('')}</div>`;
 return s
}
function renderGifts(){
 let budgetSet=new Set(state.budgets);let shown=DATA.items.filter(allowed).filter(x=>x.price==null?false:budgetSet.has(budgetFor(x.price)));
 let unknown=DATA.items.filter(allowed).filter(x=>x.price==null);
 let title=state.person==='nieces'?'🧸 Niece & Nephew Picks':state.person==='secret'?'🎅 Secret Santa Picks':state.person==='Edgar'?'❤️ Edgar Picks':state.person==='friends'?'🥂 Friend Picks':`💝 ${state.person}'s Picks`;
 $('app').innerHTML=`<div class="actions"><button class="secondary" onclick="setPage('budgets')">← Change Budgets</button><button class="primary" onclick="setPage('people')">Start Over</button></div><div class="hint"><b>${title}</b><br>Showing your selected budget${state.budgets.length>1?'s':''}. Special gift visibility rules are applied automatically.</div>${shown.length?'<div class="grid">'+shown.map(itemCard).join('')+'</div>':'<div class="empty">No priced gifts match those selections for this page yet. 💕</div>'}${unknown.length?`<div class="hint" style="margin-top:25px">📝 A few gifts have no price in the original list, so they are not assigned to a budget yet: ${unknown.map(x=>esc(x.name)).join(', ')}.</div>`:''}${specialCards()}`;
}
render();
</script></body></html>
